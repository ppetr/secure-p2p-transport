[package]
name = "secure-p2p-transport"
version = "0.2.2"
edition = "2021"
publish = false
license = "Apache 2.0"
homepage = "https://github.com/ppetr/secure-p2p-transport/"

[dependencies]
iroh = { version = "0.98.2", features = ["address-lookup-mdns", "address-lookup-pkarr-dht"] }
futures-core = "0.3.31"
futures-util = "0.3.31"
tokio = { version = "1.36", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
# For checking peer identity.
rustls-pki-types = "1.10.0"
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
toml = "1.1.5"
